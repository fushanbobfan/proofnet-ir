name = "proofnet-ir"
version = "0.10.0-dev"
defaultTargets = [
  "ProofNetIR",
  "proofnet_ir_tests",
  "proofnet_ir_consumer_index_tests",
  "proofnet_ir_figure7_primitives_tests",
  "proofnet_ir_figure7_unify_payload_invariant_tests",
  "proofnet_ir_tensor_adjacency_tests",
  "proofnet_ir_progress_invariant_tests",
  "proofnet_ir_tag_history_count_tests",
  "proofnet_ir_fresh_capacity_tests",
  "proofnet_ir_queue_history_tests",
  "proofnet_ir_new_region_tests",
  "proofnet_ir_new_enabled_import_tests",
  "proofnet_ir_priority_enabled_import_tests"
]
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "ProofNetIR"

[[lean_exe]]
